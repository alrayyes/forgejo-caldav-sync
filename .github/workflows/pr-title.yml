name: PR title

# commitlint checks individual commit messages, never the PR title — and on
# a squash merge (this repo's convention, see CONTRIBUTING.md) GitHub
# defaults the squash commit message to the PR title. This is the only
# check standing between a badly titled PR and a bad message on main.
#
# pull_request_target, not pull_request: this needs base-repo permissions
# to work on PRs from forks.

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

# Keyed on the head commit too: a rebase fires several events at once, and
# a late one carrying the previous head would otherwise cancel the run for
# the new head, leaving the required check unreported. An older head's run
# now finishes instead of being cancelled; it's seconds of work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Mirrors @commitlint/config-conventional's own type list, so the two
      # checks agree on what's a valid type.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
