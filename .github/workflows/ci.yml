name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - run: go build ./...
      # gotestsum wraps go test for the JUnit report Test Analytics needs,
      # on top of the same human-readable output go test already gave.
      - run: >-
          go tool gotestsum --junitfile junit.xml --
          -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble the reports
        # Runs on pull requests too, so a broken conversion fails before
        # the merge. Only the upload below and the deploy are main-only.
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p reports/tests reports/coverage
          cp junit.xml reports/tests/unit.xml
          cp coverage.out reports/coverage/coverage.out
          go tool gocover-cobertura < coverage.out > reports/coverage/coverage.xml
          grep -q '<coverage ' reports/coverage/coverage.xml
          go tool cover -html=coverage.out -o reports/coverage/index.html
          cat > reports/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>forgejo-caldav-sync reports</title>
          </head>
          <body>
          <main>
          <h1>forgejo-caldav-sync reports</h1>
          <p>Commit <code>${SHA}</code>, published $(date -u +%Y-%m-%d) UTC.</p>
          <ul>
          <li><a href="tests/unit.xml">Test results (JUnit XML)</a></li>
          <li><a href="coverage/">Coverage (HTML)</a></li>
          <li><a href="coverage/coverage.xml">Coverage (Cobertura XML)</a></li>
          <li><a href="coverage/coverage.out">Coverage (Go cover profile)</a></li>
          </ul>
          </main>
          </body>
          </html>
          HTML
      - name: Upload the reports
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: reports
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Dependabot PR doesn't get repo secrets by default (GitHub's
          # own restriction, not a misconfiguration here) - CODECOV_TOKEN
          # is empty on that run, and this repo's branch protection makes
          # Codecov refuse a tokenless upload ("Token required because
          # branch is protected"). That's an upload hiccup on an
          # unprivileged run, not a real test regression - true here
          # would fail every Dependabot PR's CI on that basis alone
          # (confirmed live on this repo's own PR #47).
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        # Runs even on a failed test step - a red PR is exactly what Test
        # Analytics exists to explain, and a job that stops at the first
        # failing test never reaches an upload step gated behind success.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go mod tidy -diff

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # goreleaser's own build phase cross-compiles the binary before the
      # Dockerfile just COPYs it in — a plain `docker build .` can't
      # prove the image builds on its own anymore, so this proves the
      # same thing goreleaser's real release run will do, --skip=publish
      # so nothing actually pushes to ghcr.io from a CI run.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint:md
      - run: bun run lint:package-json
      - run: bun run lint:api
      # bun audit hits the npm registry directly with no retry of its own;
      # a transient ConnectionClosed there shouldn't fail a PR that has
      # nothing wrong with it. A real vulnerability finding still fails
      # the job — it just does so on the last attempt instead of the
      # first.
      #
      # `bun run audit` ignores GHSA-vfj7-8cjw-p6xm (braces, reached through
      # markdownlint-cli2): no patched release exists and it only globs this
      # repo's own files in dev. Drop the --ignore in package.json once a fixed
      # braces ships. Every other advisory still fails the job.
      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            bun run audit && exit 0
            echo "bun audit failed (attempt $attempt/3)" >&2
            sleep $((attempt * 5))
          done
          exit 1

  pages:
    # One Pages deployment per repo, so the reports ship from this single job.
    # It needs every other job: a red run publishes nothing.
    needs: [test, lint, docker, docs]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # A newer push must not cancel a deploy that's already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: site/reports
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check the reports are served
        # The deploy succeeds whether or not the files are reachable, so
        # fetch the real file. Retries cover the CDN catching up.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
