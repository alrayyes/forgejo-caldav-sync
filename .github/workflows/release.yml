name: Release

# release-please decides the version, goreleaser builds the artefacts —
# rules/go-releases.md. Every push to main either opens/updates the
# release pull request, or — when that PR was just merged — cuts the tag
# and release, which the goreleaser job below picks up in the same
# workflow run (a tag pushed with the default GITHUB_TOKEN starts no
# further workflow, so a separate on-tag workflow would silently never
# fire).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # main is protected and GITHUB_TOKEN pushes as github-actions[bot],
      # which has no bypass on a personal (non-org) repo — only the repo
      # admin does. Opening the release PR itself doesn't need that (a PR
      # respects protection, it doesn't bypass it), but a PR opened with
      # the default GITHUB_TOKEN doesn't trigger pull_request-triggered
      # workflows (CI included) on itself — so this repo's own required
      # status checks would never run on it. RELEASE_TOKEN, a
      # fine-grained PAT belonging to the repo owner, avoids that.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Auto-merge the release PR itself, don't wait for a session to
      # notice — rules/releases.md. Only patch/minor-looking version
      # bumps get here without a human already having reviewed the
      # underlying feat/fix commits through their own pull requests.
      #
      # PR_JSON is parsed with jq inside the script, not fromJSON() in
      # the step's own `env:` — GitHub Actions evaluates every step's
      # context expressions when the job runs, even ones a step's own
      # `if:` will end up skipping, so a fromJSON() there throws a
      # template error on every push that doesn't open/update a PR
      # (steps.release.outputs.pr is unset then) instead of just
      # skipping quietly. Confirmed live: this crashed the job outright
      # before being rewritten this way.
      - if: steps.release.outputs.prs_created == 'true'
        run: |
          pr_number=$(jq -r '.number' <<< "$PR_JSON")
          gh pr merge --auto --squash "$pr_number"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # dist/artifacts.json lists one "Docker Image" entry per tag
      # goreleaser pushed (per-arch and the merged multi-arch manifest
      # alike); dedup by digest so the next job attests each real image
      # once, not once per tag that happens to point at it.
      - id: digests
        run: |
          digests=$(jq -c '[.[] | select(.type == "Docker Image") | .extra.Digest] | unique' dist/artifacts.json)
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

  # Ties every pushed image digest to this workflow run with a signed
  # SLSA Build L2 attestation — free, no cosign key handling required.
  # A separate matrix job because actions/attest-build-provenance takes
  # exactly one subject-digest per invocation.
  attest:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    strategy:
      matrix:
        digest: ${{ fromJSON(needs.goreleaser.outputs.digests) }}
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ matrix.digest }}
          push-to-registry: true
