# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

pre-commit:
  jobs:
    # GOTOOLCHAIN pinned: golangci-lint's own bundled type-checker panics
    # ("file requires newer Go version") when the ambient `go` on PATH is
    # newer than the one it was built against — this repo's `go 1.26.6`
    # sidesteps that regardless of what's installed system-wide.
    - name: golangci-lint fmt
      glob: "*.go"
      env:
        GOTOOLCHAIN: go1.26.6
      run: golangci-lint fmt {staged_files}
      stage_fixed: true

    # A built-in `go` subcommand, not a third-party tool: gofmt/gofumpt never
    # touch go.mod, and `go mod tidy` does network resolution a
    # formatting-only hook shouldn't be doing.
    - name: go.mod
      glob: "go.mod"
      run: go mod edit -fmt go.mod
      stage_fixed: true

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes. A hook rewriting files under a push leaves the
# pushed commit and the working tree disagreeing about what was reviewed.
pre-push:
  parallel: true
  jobs:
    - name: test
      run: go test -race ./...

    - name: golangci-lint run
      env:
        GOTOOLCHAIN: go1.26.6
      run: golangci-lint run ./...

    - name: hadolint
      glob: "Dockerfile"
      run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

    - name: go.mod
      run: go mod edit -fmt go.mod && git diff --exit-code go.mod

    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md

    - name: sort-package-json
      run: bun run lint:package-json
