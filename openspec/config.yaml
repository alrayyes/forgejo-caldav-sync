schema: spec-driven

context: |
  Go 1.27 service on github.com/alrayyes/forgejo-caldav-sync, hexagonal
  layout: internal/sync is the domain (Issue/Todo types, mapping,
  filtering, orchestration) against two interfaces it owns; internal/forgejo
  and internal/caldav adapt them to the real Forgejo API and a CalDAV
  server; internal/api is the inbound HTTP adapter; cmd/forgejo-caldav-sync
  is the composition root. Every setting is an environment variable, no
  config file or flags — see cmd/forgejo-caldav-sync/main.go's doc comment.
  Conventional Commits, semantic-release, ships a Docker image to ghcr.io.
  Global conventions live in ~/.config/claude/CLAUDE.md and its rules/*.md
  (git.higherlearning.eu-authored, apply the same way to this GitHub repo).

